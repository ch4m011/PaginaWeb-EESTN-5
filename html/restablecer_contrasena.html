<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/png" href="../img/logo-tecnica.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña</title>
    <link rel="stylesheet" href="../css/login.css" />
    <script src="../js/recuperar_contrasena.js" defer></script>
</head>

<body>
    <button class="btn-volver" onclick="window.location.href='login.html'">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z" />
        </svg>
        Volver
    </button>

    <div class="auth-layout">
        <aside class="auth-brand">
            <div class="auth-brand__content">
                <img src="../img/logo-tecnica.png" alt="Escudo EEST N.º 5" class="auth-brand__logo">
                <p class="auth-brand__eyebrow">EEST N.º 5 · "Gral. Manuel N. Savio"</p>
                <h1 class="auth-brand__title">Creá tu nueva<br>contraseña</h1>
            </div>
        </aside>

        <div class="login-contenedor">
            <div class="login-formulario">
                <h2>Nueva contraseña</h2>

                <div id="recMessage" class="mensaje" aria-live="polite"></div>

                <form id="nuevaForm" method="post">
                    <div class="campo">
                        <label for="password">Nueva contraseña</label>
                        <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Nueva contraseña" minlength="6" required>
                            <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                                <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                    stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                    fill="none" stroke="#666" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M17.94 17.94L6.06 6.06" />
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="campo">
                        <label for="password2">Repetir contraseña</label>
                        <div class="password-wrapper">
                        <input type="password" id="password2" placeholder="Repetir contraseña" minlength="6" required>
                            <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                                <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                    stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                    fill="none" stroke="#666" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M17.94 17.94L6.06 6.06" />
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-login">Cambiar contraseña</button>
                </form>

                <p class="registrarse"><a href="olvide_contrasena.html">Pedir un enlace nuevo</a></p>
            </div>
        </div>
    </div>
</body>

</html>
